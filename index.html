<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Little Garden 🌷</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="garden">

        <!-- SKY -->

        <div class="sky">

            <div class="cloud cloud-one">☁️</div>
            <div class="cloud cloud-two">☁️</div>
            <div class="cloud cloud-three">☁️</div>

            <div class="sun">☀️</div>

            <div class="intro">
                <h1>my little garden 🌷</h1>
                <p>click around. you might find some secrets.</p>
            </div>

        </div>


        <!-- GRASS -->

        <div class="grass">


            <!-- FLOWERS / OBJECTS -->

            <button
                class="garden-item flower-one"
                data-message="Chickenpox hehe. If you know, you know!">
                🌷
            </button>


            <button
                class="garden-item flower-two"
                data-message="Hey birdie, I'll take care of you">
                🐣
            </button>


            <button
                class="garden-item flower-three"
                data-message="Sunflowers are my favorite. They always look on the bright side.">
                🌻
            </button>


            <button
                class="garden-item mushroom"
                data-message="You've made it through every weird little day so far.">
                🍄
            </button>


            <button
                class="garden-item snail"
                data-message="Slow is still moving.">
                🐌
            </button>


            <button
                class="garden-item butterfly"
                data-message="Don't be afraid to spread your wings. or your armpits. ">
                🦋
            </button>


            <button
                class="garden-item bee"
                data-message="I got stung by a bee. Not once, but twice">
                🐝
            </button>


            <button
                class="garden-item rock"
                data-message="Sometimes I sit on rocks till my butt burns">
                🪨
            </button>


            <!-- SECRET FROG -->

            <button
                class="garden-item frog"
                id="frog">
                🐸
            </button>


        </div>


        <!-- QUOTE POPUP -->

        <div class="quote-card" id="quoteCard">

            <button class="close-button" id="closeButton">
                ×
            </button>

            <div class="quote-flower">
                🌼
            </div>

            <p id="quoteText"></p>

        </div>


        <!-- LITTLE FOOTER -->

        <div class="garden-footer">
            made with love ♡ by chickenpox
        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
