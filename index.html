<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Little Garden 🌷</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="garden">

        <!-- =========================
             SKY
        ========================== -->

        <section class="sky">

            <div class="sun">☀️</div>

            <div class="cloud cloud-one">☁️</div>
            <div class="cloud cloud-two">☁️</div>
            <div class="cloud cloud-three">☁️</div>


            <div class="intro">

                <h1>
                    my little garden 🌷
                </h1>

                <p>
                    click around. you might find some secrets
                </p>

            </div>

        </section>


        <!-- =========================
             GRASS / GARDEN
        ========================== -->

        <section class="grass">


            <!-- TULIP -->

            <button
                class="garden-item tulip"
                data-message="yippie chickenpox creation"
                aria-label="Tulip"
            >
                🌷
            </button>


            <!-- CHICK -->

            <button
                class="garden-item chick"
                data-message="hey little birdie, i'll take care of you"
                aria-label="Chick"
            >
                🐣
            </button>


            <!-- SUNFLOWER -->

            <button
                class="garden-item sunflower"
                data-message="sunflowers are my favourite."
                aria-label="Sunflower"
            >
                🌻
            </button>


            <!-- MUSHROOM -->

            <button
                class="garden-item mushroom"
                data-message="i like mushrooms"
                aria-label="Mushroom"
            >
                🍄
            </button>


            <!-- SNAIL -->

            <button
                class="garden-item snail"
                data-message="slow is still moving."
                aria-label="Snail"
            >
                🐌
            </button>


            <!-- BUTTERFLY -->

            <button
                class="garden-item butterfly"
                data-message="spread your wings, and armpits"
                aria-label="Butterfly"
            >
                🦋
            </button>


            <!-- BEE -->

            <button
                class="garden-item bee"
                data-message="bzz bzz. i got stung by a bee, not once but twice"
                aria-label="Bee"
            >
                🐝
            </button>


            <!-- ROCK -->

            <button
                class="garden-item rock"
                data-message="sometimes i sit on rocks until my butt gets hot"
                aria-label="Rock"
            >
                🪨
            </button>


            <!-- SECRET FLOWER -->

            <button
                class="garden-item secret-flower"
                data-message="you found a tiny secret 🌼"
                aria-label="Secret flower"
            >
                🌼
            </button>


            <!-- EXTRA DECORATIONS -->

            <span class="decoration tiny-flower-one">
                🌸
            </span>

            <span class="decoration tiny-flower-two">
                🌼
            </span>

            <span class="decoration plant-one">
                🌱
            </span>

            <span class="decoration plant-two">
                🌿
            </span>

        </section>


        <!-- =========================
             QUOTE POPUP
        ========================== -->

        <div
            class="overlay"
            id="overlay"
        >

            <div
                class="quote-card"
                id="quoteCard"
            >

                <button
                    class="close-button"
                    id="closeButton"
                    aria-label="Close message"
                >
                    
                </button>


                <div class="quote-icon">
                    🌷
                </div>


                <p id="quoteText"></p>

            </div>

        </div>


        <!-- =========================
             FOOTER
        ========================== -->

        <footer>
            made with love ♡ by chickenpox
        </footer>

    </main>


    <script src="script.js"></script>

</body>

</html>
